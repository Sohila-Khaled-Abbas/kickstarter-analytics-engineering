[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kickstarter-analytics-engineering"
version = "2.1.0"
description = "Analytics Engineering platform for Kickstarter campaign data — Medallion Architecture, Galaxy Schema, Power BI PBIP Developer Mode"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = [
    "power-bi", "analytics-engineering", "medallion-architecture",
    "galaxy-schema", "kickstarter", "pbip", "data-engineering"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp>=3.9.5",
    "beautifulsoup4>=4.12.3",
    "cairosvg>=2.7.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "Pillow>=10.3.0",
    "tabulate>=0.9.0",
    "tqdm>=4.66.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage     = "https://github.com/Sohila-Khaled-Abbas/kickstarter-analytics-engineering"
Repository   = "https://github.com/Sohila-Khaled-Abbas/kickstarter-analytics-engineering"
Issues       = "https://github.com/Sohila-Khaled-Abbas/kickstarter-analytics-engineering/issues"
Changelog    = "https://github.com/Sohila-Khaled-Abbas/kickstarter-analytics-engineering/blob/main/CHANGELOG.md"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.ruff.per-file-ignores]
"src/*.py" = ["T201"]   # allow print() in scripts

[tool.pytest.ini_options]
testpaths   = ["tests"]
addopts     = "-v --tb=short"
python_files = ["test_*.py"]
