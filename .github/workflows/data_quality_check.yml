name: Data Profiling & Quality Validation

on:
  workflow_dispatch:

jobs:
  run-profiler:
    name: Run Python Dataset Profiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Test Profiler Script Execution
        run: |
          python src/data_profiler.py --help || python -c "import src.data_profiler; print('Profiler module loaded successfully.')"
