name: CI - Code & Model Validation

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  validate-environment:
    name: Lint & Verify Code Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-cov

      - name: Lint — Ruff Style & Import Check
        run: |
          ruff check src/ --output-format=github || true
          echo "Ruff lint step complete."

      - name: Python Syntax & Compilation Check
        run: |
          python -m py_compile src/*.py
          echo "All Python files compile successfully."

      - name: Run Unit Tests (if any)
        run: |
          if [ -d "tests" ] && [ "$(ls -A tests/)" ]; then
            pytest tests/ --tb=short -q
          else
            echo "No tests directory found — skipping pytest."
          fi

      - name: Verify PBIP Directory Structure
        run: |
          test -f powerbi/kickstarter_analytics.pbip || exit 1
          test -d powerbi/kickstarter_analytics.Report || exit 1
          test -d powerbi/kickstarter_analytics.SemanticModel || exit 1
          echo "PBIP project structure verified successfully."

      - name: Ensure Large Data Files Are Not Tracked
        run: |
          # Verify that no large raw data files are accidentally staged in git.
          # Excluded from this check:
          #   - data/metadata/   → small manifest CSVs intentionally tracked
          #   - powerbi/         → PBIP definition JSON files (.json, .tmdl) are required
          #   - assets/          → exported diagram PNGs / SVGs are intentionally tracked
          VIOLATIONS=$(git ls-files \
            | grep -E '\.(csv|json|gz|zip|parquet)$' \
            | grep -v '^data/metadata/' \
            | grep -v '^powerbi/' \
            | grep -v '^assets/' \
            || true)
          if [ -n "$VIOLATIONS" ]; then
            echo "ERROR: Large data file detected in git tracking index!"
            echo "$VIOLATIONS"
            exit 1
          fi
          echo "Git hygiene verified — zero prohibited data files tracked."

      - name: Validate Diagram Assets Exist
        run: |
          test -f assets/diagrams/medallion_pipeline_architecture.png || exit 1
          test -f assets/diagrams/galaxy_schema_erd.png || exit 1
          test -f assets/diagrams/git_pbip_automation_flow.png || exit 1
          echo "All architecture diagram assets verified."
